name: Build and publish container images

on:
  push:
    paths:
      - 'containers/Dockerfile'
      - 'containers/Dockerfile.bs'
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-chipseq:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ChIP-seq container
        uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/inutano/chip-atlas-pipeline-v2:v1.0.0
            ${{ env.REGISTRY }}/inutano/chip-atlas-pipeline-v2:latest

      - name: Verify
        run: |
          docker run --rm ${{ env.REGISTRY }}/inutano/chip-atlas-pipeline-v2:v1.0.0 versions.sh

  build-bsseq:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push BS-seq container
        uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/Dockerfile.bs
          push: true
          tags: |
            ${{ env.REGISTRY }}/inutano/chip-atlas-pipeline-v2-bs:v1.1.0
            ${{ env.REGISTRY }}/inutano/chip-atlas-pipeline-v2-bs:latest

      - name: Verify
        run: |
          docker run --rm ${{ env.REGISTRY }}/inutano/chip-atlas-pipeline-v2-bs:v1.1.0 versions.sh
